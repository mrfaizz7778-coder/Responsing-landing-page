<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            color: #12203a;
        }

        /* Navigation bar */
        nav {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px;
            background: #12203a;
            color: white;
        }

        nav a {
            color: white;
            margin: 0 8px;
            text-decoration: none;
        }

        /* Hero section */
        .hero {
            padding: 40px 16px;
            text-align: center;
            background: #2f5bea;
            color: white;
        }

        .hero h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .hero p {
            margin-bottom: 12px;
        }

        .hero img {
            max-width: 100%;
            height: auto;
            margin-top: 16px;
            border-radius: 12px;
        }

        /* Features section */
        .features {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 20px;
        }

        .box {
            background: #eef2ff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .box h3 {
            margin-bottom: 8px;
        }

        /* Footer */
        footer {
            background: #12203a;
            color: white;
            text-align: center;
            padding: 16px;
        }

        /* Tablet screen */
        @media (min-width: 768px) {
            nav {
                flex-direction: row;
                justify-content: space-between;
                padding: 14px 32px;
            }

            .hero h1 {
                font-size: 2.4rem;
            }

            .features {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Laptop screen */
        @media (min-width: 1024px) {
            .features {
                grid-template-columns: repeat(3, 1fr);
                padding: 40px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <h2>TravelEase</h2>

        <div>
            <a href="#">Home</a>
            <a href="#features">Trips</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <section class="hero">
        <h1>Plan Your Next Trip in Minutes</h1>
        <p>Simple, affordable and fun travel plans.</p>

        <img
            src="./high-mountains-hills-covered-with-forests.jpg"
            alt="Mountain trip banner"
            width="600"
        >
    </section>

    <section class="features" id="features">

        <div class="box">
            <h3>Easy Booking</h3>
            <p>Book your trip in just a few clicks.</p>
        </div>

        <div class="box">
            <h3>Best Prices</h3>
            <p>Find affordable travel options.</p>
        </div>

        <div class="box">
            <h3>24x7 Help</h3>
            <p>We are always ready to help you.</p>
        </div>

    </section>

    <footer id="contact">
        Made by a First Year Student
    </footer>

</body>
</html>
